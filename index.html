<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HIIT計時器">
  <meta name="theme-color" content="#1e272e">
  <title>HIIT 間歇運動 App</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: env(safe-area-inset-top) 18px env(safe-area-inset-bottom) 18px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #1e272e;
      color: white;
      transition: background-color 0.3s ease;
      overflow: hidden;
    }
    body.prepare    { background-color: #e67e22; }
    body.work       { background-color: #d63031; }
    body.rest       { background-color: #00b894; }
    body.cycle_rest { background-color: #6c5ce7; } /* 循環間大休息：紫色 */
    body.done       { background-color: #0984e3; }

    /* 頂部列 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      gap: 6px;
    }
    .round-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      gap: 6px;
    }
    .pill-btn {
      background: rgba(255, 255, 255, 0.16);
      color: white;
      border: none;
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 菜單橫向滑動列 */
    .preset-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0 4px 0;
      scrollbar-width: none;
    }
    .preset-bar::-webkit-scrollbar { display: none; }
    .preset-chip {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .preset-chip.active {
      background: #ffffff;
      color: #1e272e;
      border-color: #ffffff;
    }
    .preset-chip.add-chip {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    /* 主計時顯示區 */
    .main-display {
      text-align: center;
      margin: auto 0;
    }
    .status {
      font-size: 1.4rem;
      font-weight: 700;
      opacity: 0.9;
      margin-bottom: 4px;
    }
    .exercise-name {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 6px;
      min-height: 2.5rem;
    }
    .timer {
      font-size: 20vw;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .next-up {
      margin-top: 10px;
      font-size: 0.95rem;
      opacity: 0.85;
      min-height: 1.4rem;
    }

    /* 參數快速調整區：4 欄（運動、休息、組數、重複循環） */
    .settings {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px 10px;
      border-radius: 16px;
      margin-bottom: 14px;
    }
    .settings label {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
    }
    .settings input {
      margin-top: 5px;
      width: 100%;
      padding: 8px 0;
      font-size: 1.15rem;
      font-weight: bold;
      text-align: center;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.95);
      color: #2d3436;
    }

    /* 底部控制按鈕 */
    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      padding-bottom: 18px;
    }
    .controls button {
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 800;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }
    .controls button:active { transform: scale(0.96); }
    #startPauseBtn { background: #ffffff; color: #1e272e; }
    #resetBtn { background: rgba(255, 255, 255, 0.2); color: white; }

    /* 通用底部彈窗 (Modal) */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 100;
      align-items: flex-end;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #2d3436;
      width: 100%;
      max-height: 85dvh;
      border-radius: 24px 24px 0 0;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h3 { margin: 0; font-size: 1.25rem; }
    .close-btn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
    }

    /* 表單樣式 */
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      margin-bottom: 5px;
      color: rgba(255,255,255,0.85);
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 8px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.95);
      color: #1e272e;
      font-family: inherit;
    }
    .form-row-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .form-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .save-btn {
      background: #00b894;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: bold;
      width: 100%;
      margin-top: 6px;
    }

    /* 菜單管理卡片與歷史清單 */
    .list-container {
      overflow-y: auto;
      flex: 1;
      margin-bottom: 14px;
    }
    .card-item {
      background: rgba(255,255,255,0.08);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .card-sub {
      color: rgba(255,255,255,0.65);
      font-size: 0.8rem;
      margin-top: 4px;
      line-height: 1.35;
    }
    .del-btn {
      background: rgba(214, 48, 49, 0.85);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .clear-btn {
      background: #d63031;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- 頂部狀態與工具列 -->
  <div class="header">
    <div class="round-badge" id="roundDisplay">第 1/1 輪 • 組 0/8</div>
    <div class="top-actions">
      <button class="pill-btn" id="managePresetsBtn">管理菜單</button>
      <button class="pill-btn" id="openHistoryBtn">紀錄 (0)</button>
    </div>
  </div>

  <!-- 菜單快速切換列 -->
  <div class="preset-bar" id="presetBar"></div>

  <!-- 主計時畫面 -->
  <div class="main-display">
    <div class="status" id="statusText">準備開始</div>
    <div class="exercise-name" id="exerciseDisplay">經典 Tabata</div>
    <div class="timer" id="timeDisplay">00:20</div>
    <div class="next-up" id="nextUpDisplay">第 1 組：波比跳</div>
  </div>

  <!-- 底部設定與按鈕 -->
  <div>
    <div class="settings" id="settingsPanel">
      <label>運動(秒)<input type="number" id="workInput" value="20" min="1" inputmode="numeric"></label>
      <label>休息(秒)<input type="number" id="restInput" value="10" min="1" inputmode="numeric"></label>
      <label>每輪組數<input type="number" id="roundsInput" value="8" min="1" inputmode="numeric"></label>
      <label>重複輪數<input type="number" id="cyclesInput" value="1" min="1" inputmode="numeric"></label>
    </div>

    <div class="controls">
      <button id="startPauseBtn">開始訓練</button>
      <button id="resetBtn">重設</button>
    </div>
  </div>

  <!-- 彈窗 1：新增與管理菜單 -->
  <div class="modal" id="presetModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>菜單管理與新增</h3>
        <button class="close-btn" id="closePresetBtn">完成</button>
      </div>

      <!-- 新增菜單表單 -->
      <div style="background: rgba(0,0,0,0.25); padding: 14px; border-radius: 14px; margin-bottom: 16px;">
        <div class="form-group">
          <label>菜單名稱（例如：下肢爆汗、拳擊有氧）</label>
          <input type="text" id="newPresetName" placeholder="輸入菜單名稱">
        </div>
        <div class="form-row-3 form-group">
          <div><label>運動(秒)</label><input type="number" id="newPresetWork" value="30" min="1" inputmode="numeric"></div>
          <div><label>組間休息(秒)</label><input type="number" id="newPresetRest" value="15" min="1" inputmode="numeric"></div>
          <div><label>每輪組數</label><input type="number" id="newPresetRounds" value="4" min="1" inputmode="numeric"></div>
        </div>
        <div class="form-row-2 form-group">
          <div><label>重複輪數 (Cycles)</label><input type="number" id="newPresetCycles" value="3" min="1" inputmode="numeric"></div>
          <div><label>輪間大休息(秒)</label><input type="number" id="newPresetCycleRest" value="60" min="0" inputmode="numeric"></div>
        </div>
        <div class="form-group">
          <label>對應動作清單（用逗號分隔，會依組數自動循環）</label>
          <textarea id="newPresetExercises" rows="2" placeholder="例如：深蹲, 弓箭步, 跳躍深蹲, 靠牆深蹲"></textarea>
        </div>
        <button class="save-btn" id="addPresetBtn">+ 儲存為新菜單</button>
      </div>

      <div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; opacity: 0.85;">已儲存的菜單</div>
      <div class="list-container" id="presetManageList"></div>
    </div>
  </div>

  <!-- 彈窗 2：訓練歷史紀錄 -->
  <div class="modal" id="historyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>訓練歷史紀錄</h3>
        <button class="close-btn" id="closeHistoryBtn">關閉</button>
      </div>
      <div class="list-container" id="historyList"></div>
      <button class="clear-btn" id="clearHistoryBtn">清除所有紀錄</button>
    </div>
  </div>

<script>
  // --- 0. 記憶模組與預設菜單 ---
  const STORAGE_KEYS = {
    PRESETS: 'hiit_app_presets_v2',
    ACTIVE_ID: 'hiit_app_active_preset_v2',
    HISTORY: 'hiit_app_history_v2'
  };

  const DEFAULT_PRESETS = [
    {
      id: 'p_tabata',
      name: '經典 Tabata',
      work: 20,
      rest: 10,
      rounds: 8,
      cycles: 1,
      cycleRest: 60,
      exercises: ['波比跳', '高抬腿', '深蹲跳', '登山者']
    },
    {
      id: 'p_hiit_3x4',
      name: '全身循環 3 輪',
      work: 40,
      rest: 20,
      rounds: 4,
      cycles: 3,
      cycleRest: 60,
      exercises: ['開合跳', '伏地挺身', '交替弓箭步', '仰臥捲腹']
    },
    {
      id: 'p_core',
      name: '核心強化 2 輪',
      work: 30,
      rest: 15,
      rounds: 4,
      cycles: 2,
      cycleRest: 45,
      exercises: ['標準棒式', '俄羅斯轉體', '死蟲式', '單車式捲腹']
    }
  ];

  let presets = JSON.parse(localStorage.getItem(STORAGE_KEYS.PRESETS)) || DEFAULT_PRESETS;
  let activePresetId = localStorage.getItem(STORAGE_KEYS.ACTIVE_ID) || presets[0].id;

  const workInput = document.getElementById('workInput');
  const restInput = document.getElementById('restInput');
  const roundsInput = document.getElementById('roundsInput');
  const cyclesInput = document.getElementById('cyclesInput');
  const exerciseEl = document.getElementById('exerciseDisplay');
  const nextUpEl = document.getElementById('nextUpDisplay');

  function getActivePreset() {
    return presets.find(p => p.id === activePresetId) || presets[0];
  }

  function getExerciseForRound(roundNum) {
    const preset = getActivePreset();
    if (!preset.exercises || preset.exercises.length === 0) {
      return `第 ${roundNum} 組訓練`;
    }
    return preset.exercises[(roundNum - 1) % preset.exercises.length];
  }

  function renderPresetBar() {
    const bar = document.getElementById('presetBar');
    bar.innerHTML = presets.map(p => `
      <button class="preset-chip ${p.id === activePresetId ? 'active' : ''}" data-id="${p.id}">
        ${p.name}
      </button>
    `).join('') + `<button class="preset-chip add-chip" id="quickAddChip">+ 新增菜單</button>`;

    bar.querySelectorAll('.preset-chip[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state !== 'IDLE' && state !== 'DONE') return;
        selectPreset(btn.dataset.id);
      });
    });

    document.getElementById('quickAddChip').addEventListener('click', openPresetModal);
  }

  function selectPreset(id) {
    activePresetId = id;
    localStorage.setItem(STORAGE_KEYS.ACTIVE_ID, id);
    const preset = getActivePreset();
    workInput.value = preset.work;
    restInput.value = preset.rest;
    roundsInput.value = preset.rounds;
    cyclesInput.value = preset.cycles || 1;
    renderPresetBar();
    updateIdleDisplay();
  }

  // 即時記憶主畫面修改的數字
  [workInput, restInput, roundsInput, cyclesInput].forEach(input => {
    input.addEventListener('change', () => {
      const preset = getActivePreset();
      preset.work = parseInt(workInput.value, 10) || 20;
      preset.rest = parseInt(restInput.value, 10) || 10;
      preset.rounds = parseInt(roundsInput.value, 10) || 8;
      preset.cycles = parseInt(cyclesInput.value, 10) || 1;
      localStorage.setItem(STORAGE_KEYS.PRESETS, JSON.stringify(presets));
      if (state === 'IDLE') updateIdleDisplay();
    });
  });

  // 菜單管理彈窗
  const presetModal = document.getElementById('presetModal');
  function openPresetModal() {
    if (state !== 'IDLE' && state !== 'DONE') return;
    renderPresetManageList();
    presetModal.classList.add('active');
  }

  function renderPresetManageList() {
    const listEl = document.getElementById('presetManageList');
    listEl.innerHTML = presets.map(p => {
      const cyc = p.cycles || 1;
      const cycRest = p.cycleRest ?? 60;
      const cycleInfo = cyc > 1 ? ` × 重複${cyc}輪 (輪休${cycRest}秒)` : '';
      return `
        <div class="card-item">
          <div>
            <strong>${p.name}</strong>
            <div class="card-sub">${p.work}秒運動 / ${p.rest}秒休息 × ${p.rounds}組${cycleInfo}</div>
            <div class="card-sub">動作：${p.exercises.length ? p.exercises.join(' → ') : '無指定動作'}</div>
          </div>
          ${presets.length > 1 ? `<button class="del-btn" data-del="${p.id}">刪除</button>` : ''}
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const delId = btn.dataset.del;
        presets = presets.filter(p => p.id !== delId);
        localStorage.setItem(STORAGE_KEYS.PRESETS, JSON.stringify(presets));
        if (activePresetId === delId) selectPreset(presets[0].id);
        renderPresetManageList();
        renderPresetBar();
      });
    });
  }

  document.getElementById('managePresetsBtn').addEventListener('click', openPresetModal);
  document.getElementById('closePresetBtn').addEventListener('click', () => presetModal.classList.remove('active'));

  document.getElementById('addPresetBtn').addEventListener('click', () => {
    const name = document.getElementById('newPresetName').value.trim();
    if (!name) {
      alert('請輸入菜單名稱！');
      return;
    }
    const work = parseInt(document.getElementById('newPresetWork').value, 10) || 30;
    const rest = parseInt(document.getElementById('newPresetRest').value, 10) || 15;
    const rounds = parseInt(document.getElementById('newPresetRounds').value, 10) || 4;
    const cycles = parseInt(document.getElementById('newPresetCycles').value, 10) || 1;
    const cycleRest = parseInt(document.getElementById('newPresetCycleRest').value, 10) || 0;
    const rawEx = document.getElementById('newPresetExercises').value;
    const exercises = rawEx.split(/[,，\n]+/).map(s => s.trim()).filter(Boolean);

    const newPreset = {
      id: 'p_' + Date.now(),
      name,
      work,
      rest,
      rounds,
      cycles,
      cycleRest,
      exercises
    };

    presets.push(newPreset);
    localStorage.setItem(STORAGE_KEYS.PRESETS, JSON.stringify(presets));

    document.getElementById('newPresetName').value = '';
    document.getElementById('newPresetExercises').value = '';
    selectPreset(newPreset.id);
    renderPresetManageList();
    presetModal.classList.remove('active');
  });

  // --- 歷史紀錄模組 ---
  function saveWorkoutRecord(presetName, work, rest, rounds, cycles, cycleRest) {
    const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
    const now = new Date();
    const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    const oneCycleSec = (work + rest) * rounds - rest;
    const totalSec = oneCycleSec * cycles + cycleRest * (cycles - 1);
    const cycleText = cycles > 1 ? ` × ${cycles}輪` : '';

    history.unshift({
      date: dateStr,
      presetName,
      detail: `${work}秒/${rest}秒 × ${rounds}組${cycleText}`,
      duration: `${Math.floor(totalSec / 60)}分${totalSec % 60}秒`
    });

    localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
    document.getElementById('openHistoryBtn').textContent = `紀錄 (${history.length})`;
    const listEl = document.getElementById('historyList');

    if (history.length === 0) {
      listEl.innerHTML = '<p style="text-align:center; opacity:0.6; padding: 20px 0;">尚無訓練紀錄，快開始第一組吧！</p>';
      return;
    }

    listEl.innerHTML = history.map(item => `
      <div class="card-item">
        <div>
          <strong>${item.presetName || '自訂訓練'}</strong>
          <div class="card-sub">${item.detail} • ${item.date}</div>
        </div>
        <div style="font-weight:bold; color:#00b894; flex-shrink:0;">${item.duration}</div>
      </div>
    `).join('');
  }

  const historyModal = document.getElementById('historyModal');
  document.getElementById('openHistoryBtn').addEventListener('click', () => {
    renderHistory();
    historyModal.classList.add('active');
  });
  document.getElementById('closeHistoryBtn').addEventListener('click', () => historyModal.classList.remove('active'));
  document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    if (confirm('確定要清除所有運動紀錄嗎？')) {
      localStorage.removeItem(STORAGE_KEYS.HISTORY);
      renderHistory();
    }
  });

  // --- 1. 音效、語音與震動 ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beep(freq = 600, duration = 0.15) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'zh-TW';
      msg.rate = 1.1;
      window.speechSynthesis.speak(msg);
    }
  }

  function vibrate(pattern) {
    if ('vibrate' in navigator) navigator.vibrate(pattern);
  }

  // --- 2. 防止螢幕休眠 ---
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {}
  }
  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().then(() => { wakeLock = null; });
    }
  }

  // --- 3. 計時器狀態機 (支援多輪重複循環) ---
  let state = 'IDLE'; // IDLE, PREPARE, WORK, REST, CYCLE_REST, DONE
  let currentRound = 1;
  let totalRounds = 8;
  let currentCycle = 1;
  let totalCycles = 1;
  let workSec = 20;
  let restSec = 10;
  let cycleRestSec = 60;

  let timerId = null;
  let endTime = 0;
  let remainingMs = 0;
  let isPaused = false;
  let lastBeepSec = -1;

  const statusEl = document.getElementById('statusText');
  const timeEl = document.getElementById('timeDisplay');
  const roundEl = document.getElementById('roundDisplay');
  const startPauseBtn = document.getElementById('startPauseBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const presetBarEl = document.getElementById('presetBar');

  function updateBadge() {
    roundEl.textContent = `第 ${currentCycle}/${totalCycles} 輪 • 組 ${currentRound}/${totalRounds}`;
  }

  function updateIdleDisplay() {
    const preset = getActivePreset();
    const w = parseInt(workInput.value, 10) || 20;
    const r = parseInt(roundsInput.value, 10) || 8;
    const c = parseInt(cyclesInput.value, 10) || 1;
    const mins = String(Math.floor(w / 60)).padStart(2, '0');
    const secs = String(w % 60).padStart(2, '0');
    timeEl.textContent = `${mins}:${secs}`;
    roundEl.textContent = `第 1/${c} 輪 • 組 0/${r}`;
    exerciseEl.textContent = preset.name;
    nextUpEl.textContent = `第 1 組：${getExerciseForRound(1)}`;
  }

  function enterPhase(newState, durationSec) {
    state = newState;
    endTime = Date.now() + durationSec * 1000;
    lastBeepSec = -1;
    document.body.className = newState.toLowerCase();

    if (newState === 'PREPARE') {
      const firstEx = getExerciseForRound(1);
      statusEl.textContent = '準備姿勢';
      exerciseEl.textContent = firstEx;
      nextUpEl.textContent = `第 1 輪第 1 組即將開始`;
      beep(440, 0.2);
      speak(`準備開始，第一個動作，${firstEx}`);
    } else if (newState === 'WORK') {
      const currentEx = getExerciseForRound(currentRound);
      statusEl.textContent = '全力衝刺！';
      exerciseEl.textContent = currentEx;
      updateBadge();

      if (currentRound < totalRounds) {
        nextUpEl.textContent = `下一組：${getExerciseForRound(currentRound + 1)}`;
      } else if (currentCycle < totalCycles) {
        nextUpEl.textContent = `本輪最後一組，接著輪間大休息`;
      } else {
        nextUpEl.textContent = `最終組數，全力以赴！`;
      }

      beep(880, 0.35);
      vibrate([200, 100, 200]);
      speak(`${currentEx}，開始`);
    } else if (newState === 'REST') {
      const nextEx = getExerciseForRound(currentRound + 1);
      statusEl.textContent = '組間休息';
      exerciseEl.textContent = '調整呼吸';
      nextUpEl.textContent = `下一組 (${currentRound + 1}/${totalRounds})：${nextEx}`;
      beep(520, 0.3);
      vibrate(300);
      speak(`休息一下，下一組是${nextEx}`);
    } else if (newState === 'CYCLE_REST') {
      const nextEx = getExerciseForRound(1);
      statusEl.textContent = `第 ${currentCycle} 輪完成！大休息`;
      exerciseEl.textContent = '補充水分';
      nextUpEl.textContent = `即將進入第 ${currentCycle + 1} 輪：${nextEx}`;
      beep(440, 0.25);
      setTimeout(() => beep(660, 0.3), 180);
      vibrate([300, 150, 300]);
      speak(`完成第 ${currentCycle} 輪，大休息一下`);
    } else if (newState === 'DONE') {
      const preset = getActivePreset();
      statusEl.textContent = '全部訓練完成！';
      exerciseEl.textContent = preset.name;
      timeEl.textContent = '00:00';
      nextUpEl.textContent = `共完成 ${totalCycles} 輪訓練，太強了！`;
      beep(880, 0.15);
      setTimeout(() => beep(1100, 0.4), 200);
      vibrate([300, 100, 300, 100, 500]);
      speak('恭喜完成所有訓練');
      clearInterval(timerId);
      releaseWakeLock();
      saveWorkoutRecord(preset.name, workSec, restSec, totalRounds, totalCycles, cycleRestSec);
      startPauseBtn.textContent = '再來一輪';
      settingsPanel.style.pointerEvents = 'auto';
      settingsPanel.style.opacity = '1';
      presetBarEl.style.pointerEvents = 'auto';
      presetBarEl.style.opacity = '1';
    }
  }

  function tick() {
    const diff = endTime - Date.now();
    if (diff <= 0) {
      if (state === 'PREPARE') {
        enterPhase('WORK', workSec);
      } else if (state === 'WORK') {
        if (currentRound < totalRounds) {
          enterPhase('REST', restSec);
        } else if (currentCycle < totalCycles) {
          // 該輪結束，進入輪間大休息（若輪休設為 0 秒則直接進入下一輪）
          if (cycleRestSec > 0) {
            enterPhase('CYCLE_REST', cycleRestSec);
          } else {
            currentCycle++;
            currentRound = 1;
            enterPhase('WORK', workSec);
          }
        } else {
          enterPhase('DONE', 0);
        }
      } else if (state === 'REST') {
        currentRound++;
        enterPhase('WORK', workSec);
      } else if (state === 'CYCLE_REST') {
        currentCycle++;
        currentRound = 1;
        enterPhase('WORK', workSec);
      }
      return;
    }

    const secLeft = Math.ceil(diff / 1000);
    const mins = String(Math.floor(secLeft / 60)).padStart(2, '0');
    const secs = String(secLeft % 60).padStart(2, '0');
    timeEl.textContent = `${mins}:${secs}`;

    if (secLeft <= 3 && secLeft !== lastBeepSec) {
      lastBeepSec = secLeft;
      beep(600, 0.1);
    }
  }

  startPauseBtn.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (state === 'IDLE' || state === 'DONE') {
      const preset = getActivePreset();
      workSec = parseInt(workInput.value, 10) || 20;
      restSec = parseInt(restInput.value, 10) || 10;
      totalRounds = parseInt(roundsInput.value, 10) || 8;
      totalCycles = parseInt(cyclesInput.value, 10) || 1;
      cycleRestSec = preset.cycleRest ?? 60;

      currentRound = 1;
      currentCycle = 1;
      isPaused = false;

      settingsPanel.style.pointerEvents = 'none';
      settingsPanel.style.opacity = '0.4';
      presetBarEl.style.pointerEvents = 'none';
      presetBarEl.style.opacity = '0.4';
      startPauseBtn.textContent = '暫停';
      requestWakeLock();

      enterPhase('PREPARE', 5);
      timerId = setInterval(tick, 100);
    } else if (!isPaused) {
      isPaused = true;
      clearInterval(timerId);
      remainingMs = endTime - Date.now();
      releaseWakeLock();
      startPauseBtn.textContent = '繼續';
      statusEl.textContent = '已暫停';
    } else {
      isPaused = false;
      endTime = Date.now() + remainingMs;
      requestWakeLock();
      startPauseBtn.textContent = '暫停';
      const statusMap = {
        WORK: '全力衝刺！',
        REST: '組間休息',
        CYCLE_REST: `第 ${currentCycle} 輪完成！大休息`,
        PREPARE: '準備姿勢'
      };
      statusEl.textContent = statusMap[state] || '進行中';
      timerId = setInterval(tick, 100);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    clearInterval(timerId);
    releaseWakeLock();
    state = 'IDLE';
    isPaused = false;
    document.body.className = '';
    statusEl.textContent = '準備開始';
    updateIdleDisplay();
    startPauseBtn.textContent = '開始訓練';
    settingsPanel.style.pointerEvents = 'auto';
    settingsPanel.style.opacity = '1';
    presetBarEl.style.pointerEvents = 'auto';
    presetBarEl.style.opacity = '1';
  });

  // 初始化載入
  selectPreset(activePresetId);
  renderHistory();
</script>
</body>
</html>
